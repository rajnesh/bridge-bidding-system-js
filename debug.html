<!DOCTYPE html>
<html>
<head>
    <title>Debug Bridge System</title>
</head>
<body>
    <div id="output"></div>
    
    <script src="js/bridge-types.js"></script>
    <script src="js/convention-manager.js"></script>
    <script src="js/bidding-system.js"></script>
    <script src="js/sayc-system.js"></script>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += '<div>' + message + '</div>';
        }
        
        // Catch all errors
        window.addEventListener('error', (event) => {
            log('JavaScript Error: ' + event.message + ' at ' + event.filename + ':' + event.lineno);
            log('Stack: ' + (event.error ? event.error.stack : 'No stack available'));
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            log('Unhandled Promise Rejection: ' + event.reason);
        });
        
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                log('Starting debug...');
                
                // Check if classes are available
                log('Checking SAYCBiddingSystem availability: ' + (typeof SAYCBiddingSystem));
                log('Checking Hand availability: ' + (typeof Hand));
                log('Checking BiddingSystem availability: ' + (typeof BiddingSystem));
                log('Checking ConventionCard availability: ' + (typeof ConventionCard));
                
                if (typeof SAYCBiddingSystem === 'undefined') {
                    log('ERROR: SAYCBiddingSystem is not defined');
                    return;
                }
                
                // Test creating SAYCBiddingSystem
                log('Creating SAYCBiddingSystem...');
                const system = new SAYCBiddingSystem();
                log('SAYCBiddingSystem created successfully');
                log('System conventions: ' + (system.conventions ? 'Available' : 'Not available'));
                
                // Test loading config
                log('Loading conventions config...');
                await system.conventions.loadConfig('conventions.json');
                log('Conventions config loaded successfully');
                
                // Test creating a hand
                log('Testing Hand creation...');
                const hand = new Hand('AKQ2 J432 32 32');
                log('Hand created: HCP=' + hand.hcp);
                
                // Test starting auction
                log('Testing auction start...');
                system.startAuctionWithDealer('S', 'W', false, false);
                log('Auction started successfully');
                
                log('All tests passed!');
                
            } catch (error) {
                log('ERROR: ' + error.message);
                log('Stack: ' + error.stack);
                console.error(error);
            }
        });
    </script>
</body>
</html>
