<!DOCTYPE html>
<html>
<head>
    <title>Convention Manager Test</title>
</head>
<body>
    <div id="output"></div>
    
    <script src="js/bridge-types.js"></script>
    <script src="js/convention-manager.js"></script>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += '<div>' + msg + '</div>';
            console.log(msg);
        }
        
        window.addEventListener('error', (e) => {
            log('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                log('Testing ConventionCard...');
                
                const conv = new ConventionCard();
                log('✓ ConventionCard created');
                
                log('Testing config load...');
                await conv.loadConfig('conventions.json');
                log('✓ Config loaded successfully');
                
                log('Testing isEnabled method...');
                const enabled = conv.isEnabled('splinter_bids', 'responses');
                log('✓ isEnabled worked: ' + enabled);
                
                log('All convention tests passed!');
                
            } catch (error) {
                log('ERROR: ' + error.message);
                log('Stack: ' + error.stack);
            }
        });
    </script>
</body>
</html>
