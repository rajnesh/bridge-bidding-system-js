<!DOCTYPE html>
<html>
<head>
    <title>Step by Step Test</title>
</head>
<body>
    <div id="log"></div>
    
    <script>
        function log(msg) {
            document.getElementById('log').innerHTML += '<div>' + msg + '</div>';
            console.log(msg);
        }
        
        window.addEventListener('error', (e) => {
            log('❌ ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        
        log('🔄 Starting step-by-step test...');
    </script>
    
    <script src="js/bridge-types.js"></script>
    <script>
        log('✅ bridge-types.js loaded');
        log('📝 Hand available: ' + (typeof Hand !== 'undefined'));
        log('📝 Bid available: ' + (typeof Bid !== 'undefined'));
    </script>
    
    <script src="js/convention-manager.js"></script>
    <script>
        log('✅ convention-manager.js loaded');
        log('📝 ConventionCard available: ' + (typeof ConventionCard !== 'undefined'));
    </script>
    
    <script src="js/bidding-system.js"></script>
    <script>
        log('✅ bidding-system.js loaded');
        log('📝 BiddingSystem available: ' + (typeof BiddingSystem !== 'undefined'));
    </script>
    
    <script src="js/sayc-system.js"></script>
    <script>
        log('✅ sayc-system.js loaded');
        log('📝 SAYCBiddingSystem available: ' + (typeof SAYCBiddingSystem !== 'undefined'));
    </script>
    
    <script>
        log('🚀 Testing actual instantiation...');
        
        try {
            const hand = new Hand('AKQ2 J432 32 32');
            log('✅ Hand created successfully');
            
            const conv = new ConventionCard();
            log('✅ ConventionCard created successfully');
            
            const system = new SAYCBiddingSystem();
            log('✅ SAYCBiddingSystem created successfully');
            
            log('🎉 All basic tests passed!');
            
        } catch (error) {
            log('❌ Error during instantiation: ' + error.message);
            log('Stack: ' + error.stack);
        }
    </script>
</body>
</html>
