<!DOCTYPE html>
<html>
<head>
    <title>Simple Config Test</title>
</head>
<body>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + msg + '</div>';
            console.log(msg);
        }
        
        async function testConfigLoad() {
            try {
                log('Testing fetch of conventions.json...');
                const response = await fetch('conventions.json');
                log('Fetch response status: ' + response.status);
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                
                const config = await response.json();
                log('Config loaded successfully!');
                log('Config keys: ' + Object.keys(config).join(', '));
                
            } catch (error) {
                log('Error loading config: ' + error.message);
                log('Error stack: ' + error.stack);
            }
        }
        
        testConfigLoad();
    </script>
</body>
</html>
