<!DOCTYPE html>
<html>
<head>
    <title>Browser-Only Test</title>
</head>
<body>
    <div id="output"></div>
    
    <script src="js/bridge-types.js"></script>
    <script src="js/convention-manager.js"></script>
    <script src="js/bidding-system.js"></script>
    <script src="js/sayc-system.js"></script>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += '<div>' + msg + '</div>';
            console.log(msg);
        }
        
        window.addEventListener('error', (e) => {
            log('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                log('Testing browser-only functionality...');
                
                // Test class availability
                log('SAYCBiddingSystem available: ' + (typeof SAYCBiddingSystem !== 'undefined'));
                log('Hand available: ' + (typeof Hand !== 'undefined'));
                log('ConventionCard available: ' + (typeof ConventionCard !== 'undefined'));
                
                // Test creating system
                log('Creating SAYCBiddingSystem...');
                const system = new SAYCBiddingSystem();
                log('✓ System created');
                
                // Test loading config
                log('Loading config...');
                await system.conventions.loadConfig('conventions.json');
                log('✓ Config loaded');
                
                // Test hand
                log('Testing hand...');
                const hand = new Hand('AKQ2 J432 32 32');
                log('✓ Hand created, HCP: ' + hand.hcp);
                
                // Test auction
                log('Testing auction...');
                system.startAuctionWithDealer('S', 'W', false, false);
                log('✓ Auction started');
                
                log('🎉 All browser tests passed!');
                
            } catch (error) {
                log('❌ ERROR: ' + error.message);
                log('Stack: ' + error.stack);
            }
        });
    </script>
</body>
</html>
